<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The FAST/WE Awards 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Playfair+Display:ital,wght@0,600;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e7c46a; --gold2:#b8892b; --gold3:#fff1c2;
  --red:#7a0b14; --red2:#4a050b; --ink:#0b0708; --card:#17100f;
  --text:#f5ecd9; --muted:#bfae8f;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.gold-text{background:linear-gradient(180deg,var(--gold3),var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.cinzel{font-family:Cinzel,serif;letter-spacing:.06em}
.play{font-family:"Playfair Display",serif}

/* Stage */
#stage{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(ellipse 60% 45% at 50% 18%,rgba(255,226,150,.22),transparent 70%),
   radial-gradient(ellipse 90% 60% at 50% 110%,rgba(122,11,20,.55),transparent 70%),
   linear-gradient(#120a0b,#070405)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:conic-gradient(from 200deg at 20% -10%,transparent 0 8deg,rgba(255,230,170,.07) 10deg 18deg,transparent 20deg),
             conic-gradient(from 140deg at 80% -10%,transparent 0 8deg,rgba(255,230,170,.07) 10deg 18deg,transparent 20deg);
  animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translateX(4%) }}
#valance{position:fixed;top:0;left:0;right:0;height:calc(34px + var(--safe-t));z-index:30;pointer-events:none;
  background:repeating-radial-gradient(circle at 50% -60%,#9b1420 0 18px,#5a070f 26px 30px);
  box-shadow:0 6px 18px rgba(0,0,0,.7);border-bottom:3px solid var(--gold2)}
#valance::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;
  background:radial-gradient(circle at 10px -2px,var(--gold) 3px,transparent 4px) 0 0/20px 10px repeat-x}

/* Curtains */
.curtain{position:fixed;top:0;bottom:0;width:51%;z-index:8;pointer-events:none;transition:transform 2.2s cubic-bezier(.7,0,.2,1);
  background:repeating-linear-gradient(90deg,#5a060e 0,#9c1422 6%,#c0202f 9%,#86101c 13%,#4d040b 17%);
  box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.curtain::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 75%,rgba(0,0,0,.5))}
#cL{left:0;transform-origin:left}
#cR{right:0}
body.open #cL{transform:translateX(-92%) scaleX(.9)}
body.open #cR{transform:translateX(92%) scaleX(.9)}

/* Main scroll area */
main{position:relative;z-index:10;min-height:100vh;min-height:100dvh;box-sizing:border-box;
  padding:calc(88px + var(--safe-t)) 18px calc(160px + var(--safe-b));display:flex;flex-direction:column;align-items:center}
.wrap{flex-shrink:0;width:100%;max-width:480px;display:flex;flex-direction:column;gap:16px}
.center{text-align:center}
.wrap::after{content:"";display:block;flex-shrink:0;height:40px}

/* Audience */
#audience{position:fixed;left:0;right:0;bottom:0;height:calc(44px + var(--safe-b));z-index:20;pointer-events:none}
#audience svg{width:100%;height:100%;display:block}
#audience .head{transform-box:fill-box;transform-origin:50% 100%}
body.cheer #audience .head{animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}

/* Top bar */
#topbar{position:absolute;top:calc(40px + var(--safe-t));right:10px;z-index:31;display:flex;gap:8px}
.pill{background:rgba(0,0,0,.55);border:1px solid rgba(231,196,106,.4);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--gold)}

/* Elements */
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:8px}
.statue{width:64px;height:auto;filter:drop-shadow(0 0 16px rgba(231,196,106,.45))}
h1{margin:0;font-family:Cinzel,serif;font-weight:900;font-size:clamp(30px,9vw,44px);line-height:1.05;letter-spacing:.04em}
h2{margin:0;font-family:Cinzel,serif;font-weight:700;font-size:22px;letter-spacing:.05em}
.sub{color:var(--muted);font-size:15px;line-height:1.5}
.kicker{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.card{background:linear-gradient(180deg,rgba(32,20,18,.92),rgba(18,11,10,.95));border:1px solid rgba(231,196,106,.35);
  border-radius:18px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,240,200,.08)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px 18px;font-weight:600;font-size:17px;
  background:linear-gradient(180deg,#f3d886,#c99a37);color:#2a1a05;box-shadow:0 6px 0 #7d5a17,0 10px 24px rgba(0,0,0,.45);
  transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #7d5a17}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid rgba(231,196,106,.5);box-shadow:none}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:1px solid rgba(231,196,106,.3);background:rgba(255,255,255,.03);border-radius:14px;padding:10px 10px;
  font-size:15px;font-weight:500;min-height:50px;transition:all .15s}
.choice.sel{background:linear-gradient(180deg,#f3d886,#c99a37);color:#2a1a05;border-color:transparent;transform:scale(1.03)}
.choice.used{opacity:.3;text-decoration:line-through;pointer-events:none}
.progress{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold3));transition:width .3s}
.q{font-family:"Playfair Display",serif;font-size:22px;line-height:1.3}
.small{font-size:13px;color:var(--muted)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:#000;border:1px dashed var(--gold2);
  border-radius:10px;padding:12px;color:var(--gold3)}
textarea{width:100%;min-height:110px;background:#000;color:var(--gold3);border:1px solid var(--gold2);border-radius:10px;padding:10px;font:12px ui-monospace,Menlo,monospace}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-size:15px}
.ok{color:#9be29b}.no{color:#7b6b5a}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:8px}

/* Show */
.envelope{position:relative;margin:4px auto;width:220px;height:140px;border-radius:8px;
  background:linear-gradient(160deg,#f6e3a8,#d6ae52 55%,#b58a2e);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.envelope::before{content:"";position:absolute;left:0;right:0;top:0;height:78px;background:linear-gradient(180deg,#e9cc77,#c99a37);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s}
.envelope::after{content:"";position:absolute;left:50%;top:62px;width:30px;height:30px;margin-left:-15px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#d33,#7a0b14);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.envelope.opened::before{transform:rotateX(180deg)}
.envelope.opened::after{opacity:0}
.shake{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(1px,0) rotate(-1deg)}50%{transform:translate(-1px,1px) rotate(1deg)}100%{transform:translate(1px,-1px)}}
.winner-name{font-family:Cinzel,serif;font-weight:900;font-size:clamp(34px,11vw,52px);line-height:1.05;text-shadow:0 0 30px rgba(231,196,106,.4)}
.award-title{font-family:"Playfair Display",serif;font-style:italic;font-size:24px}
.reveal{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.noms{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.nom{padding:8px 14px;border-radius:999px;border:1px solid rgba(231,196,106,.45);font-size:15px}
.spot{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity 1s;
  background:radial-gradient(circle at 50% 42%,rgba(255,240,200,.28),transparent 38%),rgba(0,0,0,.45)}
body.spotlight .spot{opacity:1}

/* Commercial break */
.ad{border-radius:16px;overflow:hidden;border:6px solid #2a2a2a;box-shadow:0 0 0 2px #555,0 20px 50px rgba(0,0,0,.7);background:#111}
.ad-screen{position:relative;padding:22px 18px;min-height:300px;display:flex;flex-direction:column;gap:12px;justify-content:center;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;text-align:center}
.ad-screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px 4px);animation:flick .2s infinite}
@keyframes flick{50%{opacity:.7}}
.ad-brand{font-family:Cinzel,serif;font-weight:900;font-size:28px;letter-spacing:.04em}
.ad-tag{font-family:"Playfair Display",serif;font-style:italic;font-size:19px}
.ad-fine{font-size:11px;opacity:.85}
.bumper{font-family:Cinzel,serif;font-size:13px;letter-spacing:.3em;color:#ff5a5a;display:flex;align-items:center;gap:8px;justify-content:center}
.bumper i{width:10px;height:10px;border-radius:50%;background:#ff3b3b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

.finale-grid{display:grid;grid-template-columns:1fr;gap:10px}
.fg{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(231,196,106,.25)}
.fg b{font-family:Cinzel,serif;color:var(--gold3)}
.fg span{display:block;font-family:"Playfair Display",serif;font-style:italic;color:var(--gold);font-size:15px;margin-top:2px}

#confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="stage"></div>
<div class="spot"></div>
<div id="valance"></div>
<div class="curtain" id="cL"></div>
<div class="curtain" id="cR"></div>
<div id="topbar"><button class="pill" id="muteBtn" aria-label="Toggle sound">Sound on</button></div>
<main id="app"></main>
<div id="audience"></div>
<canvas id="confetti"></canvas>
<div id="modal" class="modal hidden"></div>

<script>
/* ================= CONFIG ================= */
// Players (voters and nominees). Dustin is not playing.
const ROSTER = [
  "Alejandra Ramos-Galvez","Andrea Ramirez","Andreia da Silva Rosa","Dominic Sett","Flavia Guerra",
  "Jaffar Abbas","Lucas Turmena","Nabiyya Perrenia","Nico Fricke","Rafael Kuhn","Simone Sandholz",
  "Maria Sol Saliva","Yauheniya Shershunovich"
];
const short = n => n==="Maria Sol Saliva" ? "Sol" : n.split(" ")[0];
const byShort = (x,y) => short(x).localeCompare(short(y));

// Awards. q = ballot question, t = award title, c = compliment read on stage.
const AWARDS = [
 {id:"travel", q:"Who is most likely to be at a conference or a COP right now?", t:"Best International Feature",
  c:"More stamps than a ministry archive. Carrying FAST/WE across borders, one side event at a time."},
 {id:"visuals", q:"Who is most likely to make a slide that belongs in a gallery?", t:"Best Visual Effects",
  c:"Making data look like art. The audience gasps at every chart."},
 {id:"newbie", q:"Who was the best newbie this year?", t:"Breakthrough Performance of the Year",
  c:"Joined the cast and started stealing scenes from day one. Bonn was not ready."},
 {id:"distracted", q:"Who is most likely to open one email and end up in five other projects by lunch?", t:"Everything Everywhere All at Once",
  c:"For a mind that runs twelve threads in parallel and somehow ties every one of them together."},
 {id:"coffee", q:"Who is most likely to be unreachable before their first coffee or tea?", t:"Best Supporting Caffeine",
  c:"Fuelled by the morning cup, powered by brilliance. The UN Campus kitchen thanks you for your loyal service."},
 {id:"weaver", q:"Who is most likely to bring people and ideas together?", t:"The Golden Loom",
  c:"If ideas were threads, you would be the one weaving them into something that holds. Every team needs its loom."},
 {id:"acronym", q:"Who is most likely to come up with the best acronym?", t:"Best Original Acronym",
  c:"Some people name a project. You give it an identity. Somewhere, a project is grateful it got such a good name."},
 {id:"midnight", q:"Who is most likely to send an email at 23:47?", t:"The Night Shift",
  c:"Proof that good ideas do not check the clock. Now please, go to sleep."},
 {id:"deadline", q:"Who is most likely to submit a project proposal at 23:59 and still nail it?", t:"Best Thriller: Deadline",
  c:"Cool under pressure, sharp at the buzzer. Every call for proposals fears your final-hour energy."},
 {id:"meeting", q:"Who is most likely to turn a 5-minute check-in into a 60-minute deep dive?", t:"The Director's Cut",
  c:"Because some ideas deserve the extended edition, with commentary track."},
 {id:"snacks", q:"Who is most likely to show up with snacks or cake?", t:"Best Catering in a Leading Role",
  c:"Morale is a renewable resource, and you are its main supplier."},
 {id:"calm", q:"Who is most likely to stay calm when everything is on fire?", t:"Calm in Every Storm",
  c:"The steady hand behind every take. Things fall apart a little less when you are in the room."},
 {id:"files", q:"Who is most likely to know where that one file is on the shared drive?", t:"Lifetime Achievement in Finding Things",
  c:"The human search bar. Report_final_FINAL_v3 holds no secrets from you."},
 {id:"google", q:"Who is most likely to find any answer in under ten seconds?", t:"The Google Search Champion",
  c:"Ask a question and the answer arrives before you finish typing it. Wikipedia nervously checks its sources."},
 {id:"punctual", q:"Who is most likely to be first in the meeting room?", t:"The Always-On-Time Award",
  c:"Early to every meeting and somehow never stressed about it. The clock sets itself by you."},
 {id:"comedian", q:"Who is most likely to make the whole room laugh?", t:"The Office Comedian",
  c:"Perfect timing, peer-reviewed. The break room is a better place for it."},
 {id:"mute", q:"Who is most likely to start talking while still on mute?", t:"Best Silent Film Performance",
  c:"A moving performance, entirely without sound. The audience can only imagine the dialogue."},
 {id:"sigh", q:"Who is most likely to sigh loudly at work?", t:"Best Dramatic Performance",
  c:"A sigh that carries across the whole floor. Shakespeare would have cast you as the lead."},
 {id:"optimist", q:"Who is most likely to say 'it will all work out' on deadline day?", t:"The Eternal Optimist",
  c:"Sees the glass half full and the grant as already approved. The sun follows you down the corridor."},
 {id:"tabs", q:"Who is most likely to have 47 browser tabs open?", t:"Best Ensemble Cast of Tabs",
  c:"Every tab is research, and every tab is essential. Nobody dares ask you to close one."}
];

// Backup titles for anyone the votes did not reach.
const BACKUPS = [
 {t:"The Spirit of FAST/WE", c:"For being the kind of colleague that makes this place feel like a team, not an org chart."},
 {t:"Best Ensemble Cast Member", c:"No film works without its ensemble, and this one would fall apart without you."},
 {t:"The Golden Bonn Award", c:"Awarded for consistent excellence, good humour and surviving another Bonn winter with style."},
 {t:"Most Valuable Colleague", c:"Quietly essential. The credits roll a little longer because of you."},
 {t:"The People's Favourite", c:"The audience has spoken: they simply like having you around."},
 {t:"Best Plot Twist", c:"Always bringing the idea nobody saw coming, and it usually works."},
 {t:"Best Chemistry Off Screen", c:"The kind of colleague who makes every meeting, lunch and coffee run a little better."},
 {t:"The Quiet Genius Award", c:"Delivers the good work, skips the drama, and the credits would look thin without you."},
 {t:"Best Comeback Kid", c:"Whatever the week throws at you, you are back on set on Monday, ready for the next take."},
 {t:"The Hidden Gem", c:"The Academy found you, and we are not letting you go."},
 {t:"Best Sense of Humour in a Research Role", c:"Peer-reviewed and audience-tested: the room is better with you in it."},
 {t:"The Backbone Award", c:"Every cast has one person the rest of the film leans on. This year, that is you."},
 {t:"Best Team Player", c:"Always first to help, last to take the credit. The ensemble sends its thanks."},
 {t:"The Rising Star Award", c:"The best is yet to come, and we all want a front-row seat."}
];

const ADS = [
 {brand:"Weaving Urban Futures", tag:"The guidebook that ties cities together.", fine:"From the makers of TUC. Side effects may include spontaneous coalition-building and an urge to buy yarn.", a1:"#1f5f5b", a2:"#0e2f3a"},
 {brand:"ARRIVE", tag:"The study that finally arrived.", fine:"Now with 100% more interview transcripts. Ask your supervisor if ARRIVE is right for you.", a1:"#5b2a86", a2:"#25103d"},
 {brand:"Acronyms Anonymous", tag:"Hi, my name is ARRIVE, and I have a backronym.", fine:"Meetings every Thursday. Snacks provided. Terms and abbreviations apply.", a1:"#8a3b12", a2:"#3a1404"},
 {brand:"UN Campus Kitchen", tag:"Powering transformative research since forever.", fine:"Proud sponsor of the Best Supporting Caffeine award. Queue times not guaranteed.", a1:"#5a3a22", a2:"#20120a"}
];
const AD_EVERY = 4;
// ---- Paste your Supabase values here (Project Settings > API) ----
const SUPABASE_URL = "https://dvrmcxrykblqddjnaagv.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_TiCK5AfRtwrHVHbDTr6bmA_ybJuLCG5";
const HOST_NAME = "Jaffar";

/* ================= STATE ================= */
const app = document.getElementById("app");
let db = null, user = null, myId = null, isOwner = false;
let remote = {};          // voterName -> {votes, at}
let imported = {};        // voterName -> {votes, at}
let me = null;            // current voter name
let draft = {};           // awardId -> nominee name
let step = 0;
let synced = false;

const LS = "fastAwards2026.ballots";
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS)||"{}") }catch(e){ return {} } }
function lsSet(o){ try{ localStorage.setItem(LS, JSON.stringify(o)) }catch(e){} }

function esc(s){ return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])) }

/* ================= BALLOT CODES ================= */
function encodeBallot(voter, votes){
  const payload = {n:ROSTER.indexOf(voter), v:AWARDS.map(a => votes[a.id] ? ROSTER.indexOf(votes[a.id]) : -1)};
  return "FAST1-" + btoa(JSON.stringify(payload)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodeBallot(code){
  try{
    let b = code.replace(/^FAST1-/,"").replace(/-/g,"+").replace(/_/g,"/");
    while(b.length%4) b+="=";
    const p = JSON.parse(atob(b));
    const voter = ROSTER[p.n]; if(!voter) return null;
    const votes = {};
    AWARDS.forEach((a,i)=>{ const x = p.v[i]; if(x>=0 && ROSTER[x] && ROSTER[x]!==voter) votes[a.id]=ROSTER[x]; });
    return {voter, votes};
  }catch(e){ return null }
}

/* ================= SOUND ================= */
let ac = null, muted = false;
function audio(){ if(muted) return null; if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)() }catch(e){ return null } } if(ac.state==="suspended") ac.resume(); return ac; }
function noiseBuf(c, secs){ const b = c.createBuffer(1, c.sampleRate*secs, c.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function drumroll(){}
function fanfare(){
  const c = audio(); if(!c) return; const t0=c.currentTime+.05;
  [[392,0],[523.25,.18],[659.25,.36],[783.99,.54],[659.25,.9],[783.99,1.05]].forEach(([fr,dt],i)=>{
    const o=c.createOscillator(); o.type="sawtooth"; o.frequency.value=fr;
    const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=2200;
    const g=c.createGain(); const len = i>=4 ? .9 : .22;
    g.gain.setValueAtTime(0,t0+dt); g.gain.linearRampToValueAtTime(.09,t0+dt+.03); g.gain.exponentialRampToValueAtTime(.001,t0+dt+len);
    o.connect(f).connect(g).connect(c.destination); o.start(t0+dt); o.stop(t0+dt+len+.05);
  });
}
function applause(dur=3.5){ document.body.classList.add("cheer"); setTimeout(()=>document.body.classList.remove("cheer"), dur*1000); }
document.getElementById("muteBtn").onclick = e => { muted=!muted; e.target.textContent = muted ? "Sound off" : "Sound on"; };

/* ================= CONFETTI ================= */
const cv = document.getElementById("confetti"), cx = cv.getContext("2d"); let parts=[], raf=null;
function sizeCv(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; }
addEventListener("resize", sizeCv); sizeCv();
function confetti(){
  const cols=["#f3d886","#fff1c2","#c99a37","#ffffff","#e7c46a","#b8892b"];
  for(let i=0;i<160;i++) parts.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.5,w:6+Math.random()*8,h:3+Math.random()*6,
    vy:2+Math.random()*4,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[i%cols.length]});
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.y+=p.vy*devicePixelRatio; p.x+=p.vx; p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); });
  parts = parts.filter(p=>p.y<cv.height+20);
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,cv.width,cv.height), null);
}

/* ================= AUDIENCE ================= */
(function(){
  let s = '<svg viewBox="0 0 400 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">';
  for(let row=0; row<2; row++){
    const y = row ? 92 : 70, r = row ? 15 : 12, fill = row ? "#050303" : "#140b0b";
    for(let x = row?-6:8; x<410; x += row?30:26){

/* ================= ALLOCATION ================= */
// Hungarian algorithm (min cost), rows <= cols. Returns col index per row.
function hungarian(cost){
  const n = cost.length, m = cost[0].length, INF = 1e18;
  const u = Array(n+1).fill(0), v = Array(m+1).fill(0), p = Array(m+1).fill(0), way = Array(m+1).fill(0);
  for(let i=1;i<=n;i++){
    p[0]=i; let j0=0; const minv=Array(m+1).fill(INF), used=Array(m+1).fill(false);
    do{
      used[j0]=true; const i0=p[j0]; let delta=INF, j1=0;
      for(let j=1;j<=m;j++) if(!used[j]){
        const cur = cost[i0-1][j-1]-u[i0]-v[j];
        if(cur<minv[j]){ minv[j]=cur; way[j]=j0; }
        if(minv[j]<delta){ delta=minv[j]; j1=j; }
      }
      for(let j=0;j<=m;j++){ if(used[j]){ u[p[j]]+=delta; v[j]-=delta; } else minv[j]-=delta; }
      j0=j1;
    } while(p[j0]!==0);
    do{ const j1=way[j0]; p[j0]=p[j1]; j0=j1; } while(j0);
  }
  const ans = Array(n).fill(-1);
  for(let j=1;j<=m;j++) if(p[j]) ans[p[j]-1]=j-1;
  return ans;
}

let ceremony = [], finale = {}, showIdx = -1, phase = "intro";
function buildCeremony(){
  const ballots = allBallots();
  const P = ROSTER.slice();                 // everyone can win anything
  const C = AWARDS.slice();
  const votes = P.map(() => C.map(() => 0));
  Object.entries(ballots).forEach(([voter,b]) => {
    const seen = {};                         // at most three votes per colleague per ballot
    C.forEach((a,ci) => { const nm = b.votes[a.id]; const pi = P.indexOf(nm); if(pi>=0 && (seen[pi]||0)<3){ votes[pi][ci]++; seen[pi]=(seen[pi]||0)+1; } });
  });
  const top = C.map((_,ci) => { let best=-1, bv=0; P.forEach((_,pi)=>{ if(votes[pi][ci]>bv){ bv=votes[pi][ci]; best=pi; } }); return best; });
  // One award per person: maximise how many people win a category they got votes in, then total votes.
  const W = (pi,ci) => (votes[pi][ci]>0 ? 100000 : 0) + votes[pi][ci]*100 + (top[ci]===pi ? 1 : 0);
  const winner = C.map(() => -1);
  if(P.length <= C.length){
    hungarian(P.map((_,pi)=>C.map((_,ci)=>-W(pi,ci)))).forEach((ci,pi)=>{ if(ci>=0 && votes[pi][ci]>0) winner[ci]=pi; });
  } else {
    hungarian(C.map((_,ci)=>P.map((_,pi)=>-W(pi,ci)))).forEach((pi,ci)=>{ if(pi>=0 && votes[pi][ci]>0) winner[ci]=pi; });
  }
  const has = P.map(() => false);
  let entries = [];
  C.forEach((a,ci) => {
    if(winner[ci]<0) return;
    has[winner[ci]] = true;
    const ranked = P.map((_,pi)=>pi).filter(pi=>votes[pi][ci]>0).sort((x,y)=>votes[y][ci]-votes[x][ci]);
    let noms = ranked.slice(0,3); if(!noms.includes(winner[ci])) noms[noms.length-1] = winner[ci];
    while(noms.length<3){ const extra = P.map((_,i)=>i).find(i=>!noms.includes(i) && !has[i]) ?? P.map((_,i)=>i).find(i=>!noms.includes(i)); if(extra===undefined) break; noms.push(extra); }
    entries.push({type:"award", award:a, winner:P[winner[ci]], noms:noms.map(i=>P[i]).sort(byShort)});
  });
  // Backup titles for everyone the votes did not reach, so each person gets exactly one award.
  const pool = BACKUPS.slice().sort(() => Math.random()-.5); let bi = 0;
  P.forEach((name,pi) => { if(!has[pi]){ const b = pool[bi++ % pool.length]; entries.push({type:"award", award:{q:"A special honour from the Academy", t:b.t, c:b.c}, winner:name, noms:null}); } });
  for(let i=entries.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [entries[i],entries[j]]=[entries[j],entries[i]]; }
  const withAds = []; let adI = 0;
  entries.forEach((s,i) => { withAds.push(s); if((i+1)%AD_EVERY===0 && i<entries.length-1){ withAds.push({type:"ad", ad:ADS[adI%ADS.length]}); adI++; } });
  ceremony = withAds;
  finale = {}; ceremony.forEach(s => { if(s.type==="award"){ (finale[s.winner] = finale[s.winner]||[]).push(s.award.t); } });
}

function hostModel(){
  if(showIdx < 0) return {kind:"intro"};

  const s = ceremony[showIdx];

  const num = ceremony.slice(0,showIdx+1).filter(x=>x.type==="award").length, total = awardCounts();
  const a = s.award, last = showIdx+1 >= ceremony.length;
  if(phase==="win") return {kind:"win", num, total, last, entry:{award:{q:a.q,t:a.t,c:a.c}, winner:s.winner}};
  return {kind: phase==="opening" ? "opening" : "noms", num, total, entry:{award:{q:a.q,t:a.t}, noms:s.noms}};   // winner stays hidden until the reveal
}

    const opening = m.kind==="opening";
    app.innerHTML = `<div class="wrap center">
      <div class="kicker">Award ${m.num} of ${m.total}</div>
      <div class="q" style="font-size:19px;color:var(--muted)">${esc(a.q)}</div>
      <h2 class="gold-text" style="font-size:26px">${esc(a.t)}</h2>
      ${m.entry.noms ? `<div class="small">The nominees are</div><div class="noms">${m.entry.noms.map(n=>`<span class="nom">${esc(short(n))}</span>`).join("")}</div>` : `<div class="small">The Academy has one more envelope</div>`}
      <div class="envelope ${opening?'shake':''}" id="env"></div>
      ${host ? `<button class="btn" id="open" ${opening?'disabled':''}>${opening?'And the award goes to...':'Open the envelope'}</button>` : `<p class="small">${opening?'And the award goes to...':'The host is about to open the envelope...'}</p>`}</div>`;
    if(opening){
      document.body.classList.add("spotlight");
      setTimeout(()=>{ const env=document.getElementById("env"); if(env){ env.classList.remove("shake"); env.classList.add("opened"); } }, 2400);
    }
    if(host && !opening) document.getElementById("open").onclick = () => {
      phase = "opening"; sync();
      setTimeout(()=>{ if(phase==="opening"){ phase="win"; sync(); } }, 2700);
    };
    return;
  }
  // win
  app.innerHTML = `<div class="wrap center">
    <div class="kicker reveal">And the award goes to</div>
    <div class="winner-name gold-text reveal" style="animation-delay:.1s">${esc(m.entry.winner)}</div>
    <div class="award-title gold-text reveal" style="animation-delay:.4s">${esc(a.t)}</div>
    <div class="card reveal" style="animation-delay:.7s"><p class="play" style="margin:0;font-size:18px;line-height:1.5;font-style:italic">${esc(a.c)}</p></div>
    ${host ? `<button class="btn reveal" id="next" style="animation-delay:1s">${m.last ? "Curtain call" : "Next award"}</button>` : ""}</div>`;
  document.body.classList.add("spotlight");
  confetti(); applause(4); fanfare();
  if(host) document.getElementById("next").onclick = () => { showIdx++; phase="noms"; sync(); };
}

// Viewer screen: every phone follows the host's show.
function renderWatch(){
  lastSeq = 0;
  app.innerHTML = `<div class="wrap center" style="margin-top:8vh"><div class="logo">${STATUE}</div>
    <h2 class="gold-text">Waiting for the host</h2><p class="sub">The show will appear here the moment ${esc(HOST_NAME)} starts it. Keep this screen open.</p>
    <button class="btn ghost" id="b">Back</button></div>`;
  document.getElementById("b").onclick = () => go("who");
  const tick = async () => {
    if(current!=="watch") return;
    try{
      const t = await rpc("get_show");
      if(t){ const m = JSON.parse(t); if(m.seq !== lastSeq){ lastSeq = m.seq; audio(); drawModel(m, false); } }
    }catch(e){}
  };
  tick(); pollT = setInterval(tick, 1500);
}

/* ================= BOOT ================= */
go("intro");
initDb();
</script>
